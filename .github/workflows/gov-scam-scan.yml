name: Government Scam Source Scan

# Independent of daily-scam-entry.yml on purpose — this bot only searches
# primary government sources (see scripts/generate-gov-scam.js) and only
# publishes when its own extra .gov-domain gate passes, so it can find
# nothing on a given day without that reflecting on the general daily bot,
# and vice versa. Scheduled 6 hours after daily-scam-entry.yml's 17:00 UTC
# run specifically so both jobs are never in flight at once — see the "git
# pull --rebase" safeguard below for what happens if that's ever violated
# anyway (e.g. two manual dispatches back to back).
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}

concurrency:
  group: gov-scam-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # See the identical comment in daily-scam-entry.yml.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Scan government sources for a scam entry
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-gov-scam.js
      - name: Email me if nothing published today
        # Same reasoning as daily-scam-entry.yml's identical step — this bot
        # shares the same silent-success-without-writing shape (confirmed
        # 2026-09-08: this run had also gone quiet for days with the job
        # itself always green) since it uses the same lib/scam-pipeline.js
        # gates. Surfacing the real reason same-day instead of waiting on
        # the 5-day staleness alert.
        if: always() && steps.generate.outputs.result != 'written' && steps.generate.outputs.result != 'already-ran'
        env:
          RESULT: ${{ steps.generate.outputs.result }}
          REASON: ${{ steps.generate.outputs.reason || steps.generate.outputs.error || 'no reason reported' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          curl -sS --max-time 15 -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              console.log(JSON.stringify({
                personalizations: [{ to: [{ email: "nolanickelliott02@gmail.com" }] }],
                from: { email: "alerts@officialverifyguard.com", name: "Scampedia Watchdog" },
                subject: "Government Scam Source Scan did not publish today (" + process.env.RESULT + ")",
                content: [{ type: "text/plain", value:
                  "Today'"'"'s Government Scam Source Scan run finished without publishing anything.\n\n" +
                  "Result: " + process.env.RESULT + "\n" +
                  "Reason: " + process.env.REASON + "\n\n" +
                  "This is not necessarily broken — a gate rejecting a bad candidate is it working as designed. " +
                  "But if this reason repeats every day, something structural (likely the citation/relevance " +
                  "network checks) is probably blocking every candidate. Run: github.com/nolanickelliott02-collab/scampedia/actions/workflows/gov-scam-scan.yml"
                }]
              }))
            ')" \
            || echo "Email alert failed, continuing anyway."
      - name: Save triage-rejected candidate to the review queue
        # Same gap as daily-scam-entry.yml's identical step, found
        # 2026-09-13 — writeToReviewQueue() only writes to this runner's own
        # disk; without a commit here, a needs-review result left zero
        # durable record and zero real notification (the email above goes
        # through the same SendGrid pipeline already confirmed dead). The
        # pull --rebase guards the same rare race as the publish step below.
        if: steps.generate.outputs.result == 'needs-review'
        env:
          # env: + "$VAR", not ${{ }} spliced into the script — see the
          # identical comment in daily-scam-entry.yml's equivalent step for
          # the real production break (2026-09-18) that motivated this.
          REVIEW_PATH: ${{ steps.generate.outputs.reviewPath }}
          REASON: ${{ steps.generate.outputs.reason }}
        run: |
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          git add review/
          git commit -m "Queue for review: $REVIEW_PATH" -m "Reason: $REASON" -m "Government-sourced candidate (gov-scam-scan)"
          git pull --rebase origin main
          git push origin main
      - name: Rebuild static scam pages
        # Also rebuilds /learn/ (build:learn) — see the identical step in
        # daily-scam-entry.yml for why build:scams alone silently erases
        # /learn/'s sitemap entries every time this runs, and why this is
        # deliberately not `npm run build` (skips check-content's hard
        # failure mode here on purpose; it already ran non-blocking above
        # in the sibling workflow's equivalent step — this bot has no
        # course-content step of its own, and doesn't need one to justify
        # this call: build:learn only touches /learn/ output, never gates
        # on course review dates).
        if: steps.generate.outputs.result == 'written'
        run: npm run build:scams && npm run build:learn
      - name: Publish directly to main
        # GitHub Pages serves main directly with no separate deploy Action,
        # so this push is what actually makes it live. The pull --rebase
        # guards against the (normally impossible, given the 6-hour
        # schedule offset above) case where daily-scam-entry.yml's own push
        # landed on main in between this job's checkout and this step.
        if: steps.generate.outputs.result == 'written'
        env:
          COUNT: ${{ steps.generate.outputs.count }}
          TITLES: ${{ steps.generate.outputs.titles }}
          LAST_TITLE: ${{ steps.generate.outputs.title }}
          CITATION: ${{ steps.generate.outputs.citation }}
        run: |
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          git add api/reports.json scams/ sitemap.xml
          PLURAL="ies"; [ "$COUNT" = "1" ] && PLURAL="y"
          git commit -m "Add $COUNT scam entr$PLURAL: $TITLES" -m "Last: $LAST_TITLE" -m "Source: $CITATION" -m "Government-sourced entry (gov-scam-scan)"
          git pull --rebase origin main
          git push origin main
      - name: Notify devices of the new entry
        if: steps.generate.outputs.result == 'written'
        env:
          ENTRY_TITLE: ${{ steps.generate.outputs.title }}
          ENTRY_SUMMARY: ${{ steps.generate.outputs.summary }}
          ENTRY_SLUG: ${{ steps.generate.outputs.slug }}
          NOTIFY_SECRET: ${{ secrets.SCAMPEDIA_NOTIFY_SECRET }}
        # Best-effort: a failed push send must not fail this job or block
        # anything — the entry is already live on scampedia.net/reports.json
        # regardless of whether anyone gets pinged about it.
        run: |
          curl -sS --max-time 15 -X POST "https://clever-bravery-production-2d5f.up.railway.app/api/notify-new-scam" \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: $NOTIFY_SECRET" \
            -d "$(node -e 'console.log(JSON.stringify({title: process.env.ENTRY_TITLE, summary: process.env.ENTRY_SUMMARY, slug: process.env.ENTRY_SLUG}))')" \
            || echo "Push notification failed, continuing anyway."
      - name: Alert on a real job failure (any step, not just "didn't publish")
        # Same reasoning as the identical step in daily-scam-entry.yml —
        # found 2026-09-18 when this exact bot's job failed for a real
        # reason (a quoting bug) and nobody found out except by chance.
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 15 -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              console.log(JSON.stringify({
                personalizations: [{ to: [{ email: "nolanickelliott02@gmail.com" }] }],
                from: { email: "alerts@officialverifyguard.com", name: "Scampedia Watchdog" },
                subject: "Government Scam Source Scan job FAILED for real (not a gate rejection)",
                content: [{ type: "text/plain", value:
                  "A step in today'"'"'s Government Scam Source Scan run actually failed — this is a real bug, " +
                  "not a gate working as designed (that path emails you separately, with a different subject line).\n\n" +
                  "Run: " + process.env.RUN_URL + "\n\n" +
                  "Open it and check which step failed and why before assuming this will fix itself tomorrow."
                }]
              }))
            ')" \
            || echo "Failure alert email failed too — nothing more this job can do."
