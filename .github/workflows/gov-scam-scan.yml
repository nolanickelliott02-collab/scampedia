name: Government Scam Source Scan

# Independent of daily-scam-entry.yml on purpose — this bot only searches
# primary government sources (see scripts/generate-gov-scam.js) and only
# queues an entry when its own extra .gov-domain gate passes, so it can find
# nothing on a given day without that reflecting on the general daily bot,
# and vice versa. Both bots add to the same review branch, so they share one
# concurrency group and never run at the same time.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}

concurrency:
  # Shared by both bots: they write to the same review branch.
  group: scampedia-pending-batch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # See the identical comment in daily-scam-entry.yml, including the
    # 2026-09-18 raise from 10 to 30 for maxAttempts: 3.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Since 2026-11-05 nothing a bot writes goes straight to the live site.
      # Both bots add to one branch, scampedia/pending-batch, and one open PR
      # from it to main is Nick's weekly review: merging it is what publishes
      # (GitHub Pages serves main). The branch picks up main first, so ids
      # and duplicate checks see both published and still-pending entries.
      - name: Switch to the pending review batch
        run: |
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin scampedia/pending-batch >/dev/null; then
            git switch -c scampedia/pending-batch origin/scampedia/pending-batch
            git merge --no-edit origin/main
          else
            git switch -c scampedia/pending-batch
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Scan government sources for a scam entry
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-gov-scam.js
      - name: Email me if nothing was added for review today
        # Same reasoning as daily-scam-entry.yml's identical step — this bot
        # shares the same silent-success-without-writing shape (confirmed
        # 2026-09-08: this run had also gone quiet for days with the job
        # itself always green) since it uses the same lib/scam-pipeline.js
        # gates. Surfacing the real reason same-day instead of waiting on
        # the 5-day staleness alert.
        if: always() && steps.generate.outputs.result != 'written' && steps.generate.outputs.result != 'already-ran'
        env:
          RESULT: ${{ steps.generate.outputs.result }}
          REASON: ${{ steps.generate.outputs.reason || steps.generate.outputs.error || 'no reason reported' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          curl -sS --max-time 15 -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              console.log(JSON.stringify({
                personalizations: [{ to: [{ email: "nolanickelliott02@gmail.com" }] }],
                from: { email: "alerts@officialverifyguard.com", name: "Scampedia Watchdog" },
                subject: "Government Scam Source Scan added nothing for review today (" + process.env.RESULT + ")",
                content: [{ type: "text/plain", value:
                  "Today'"'"'s Government Scam Source Scan run finished without adding an entry to the review batch.\n\n" +
                  "Result: " + process.env.RESULT + "\n" +
                  "Reason: " + process.env.REASON + "\n\n" +
                  "This is not necessarily broken — a gate rejecting a bad candidate is it working as designed. " +
                  "But if this reason repeats every day, something structural (likely the citation/relevance " +
                  "network checks) is probably blocking every candidate. Run: github.com/nolanickelliott02-collab/scampedia/actions/workflows/gov-scam-scan.yml"
                }]
              }))
            ')" \
            || echo "Email alert failed, continuing anyway."
      - name: Save any triage-rejected candidates to the review queue
        # writeToReviewQueue() writes rejected candidates to review/ on this
        # runner's disk; this commits them so they aren't lost when the job
        # ends. Runs unconditionally: with maxAttempts > 1 an earlier attempt
        # can write a review file even when the run's final result differs.
        # The diff check makes it a no-op when nothing is new. No
        # AI-generated text goes into the commit message.
        if: always()
        run: |
          mkdir -p review
          git add review/
          if git diff --cached --quiet; then
            echo "No new review-queue files this run."
          else
            git commit -m "Queue candidate(s) for review from this run (gov-scam-scan)"
          fi
      - name: Rebuild static scam pages
        # Also rebuilds /learn/: build:scams rewrites sitemap.xml with scam
        # pages only, and build:learn adds the /learn/ URLs back. Not
        # `npm run build`, whose check-content could block a scam entry.
        if: steps.generate.outputs.result == 'written'
        run: npm run build:scams && npm run build:learn
      - name: Add the entry to the pending review batch
        # The automated gates (structure, citation, relevance, fact-check)
        # still run first; a rejection means this step never runs. Passing
        # them now only gets an entry into the batch, not onto the site.
        # api/patterns.json is not added: it's frozen (review/phrase-queue.json
        # holds proposed phrases).
        if: steps.generate.outputs.result == 'written'
        env:
          COUNT: ${{ steps.generate.outputs.count }}
          TITLES: ${{ steps.generate.outputs.titles }}
          LAST_TITLE: ${{ steps.generate.outputs.title }}
          CITATION: ${{ steps.generate.outputs.citation }}
        run: |
          git add api/reports.json review/ scams/ learn/ sitemap.xml llms.txt llms-full.txt data/published-slugs.json
          PLURAL="ies"; [ "$COUNT" = "1" ] && PLURAL="y"
          git commit -m "Add $COUNT scam entr$PLURAL: $TITLES" -m "Last: $LAST_TITLE" -m "Source: $CITATION" -m "Bot: gov-scam-scan"
      - name: Push the batch and open the review PR if none is open
        # Device notifications are sent when the batch is merged
        # (notify-new-entries.yml), not here, because nothing is live yet.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare content, not commits: after a squash merge the branch's
          # old commits aren't in main's history, but there's nothing new.
          if git diff --quiet origin/main HEAD; then
            echo "Nothing waiting for review."
            exit 0
          fi
          git push origin scampedia/pending-batch
          OPEN=$(gh pr list --head scampedia/pending-batch --base main --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            printf '%s\n' "New entries from the Scampedia bots, held for review before they go live. Each passed the automated gates (structure, citation, relevance, fact-check). Read them in api/reports.json and the scams/ pages, plus any proposed app phrases in review/phrase-queue.json (those don't reach the app unless copied into api/patterns.json by hand). Merging publishes the entries and notifies devices once. To drop an entry, remove it on this branch before merging. The bots keep adding to this PR until it's merged." > /tmp/review-pr-body.md
            gh pr create --head scampedia/pending-batch --base main \
              --title "Scampedia: entries waiting for review" \
              --body-file /tmp/review-pr-body.md
          fi
          # List every entry in the diff in the description, check it, and
          # update the final-list comment (scripts/review-pr-sync.sh).
          scripts/review-pr-sync.sh update
      - name: Alert on a real job failure (any step, not just "didn't publish")
        # Same reasoning as the identical step in daily-scam-entry.yml —
        # found 2026-09-18 when this exact bot's job failed for a real
        # reason (a quoting bug) and nobody found out except by chance.
        # || cancelled() covers a timeout-kill too — see the fuller comment
        # on daily-scam-entry.yml's identical step for why failure() alone
        # doesn't catch that case.
        if: failure() || cancelled()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 15 -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              console.log(JSON.stringify({
                personalizations: [{ to: [{ email: "nolanickelliott02@gmail.com" }] }],
                from: { email: "alerts@officialverifyguard.com", name: "Scampedia Watchdog" },
                subject: "Government Scam Source Scan job FAILED for real (not a gate rejection)",
                content: [{ type: "text/plain", value:
                  "A step in today'"'"'s Government Scam Source Scan run actually failed — this is a real bug, " +
                  "not a gate working as designed (that path emails you separately, with a different subject line).\n\n" +
                  "Run: " + process.env.RUN_URL + "\n\n" +
                  "Open it and check which step failed and why before assuming this will fix itself tomorrow."
                }]
              }))
            ')" \
            || echo "Failure alert email failed too — nothing more this job can do."
