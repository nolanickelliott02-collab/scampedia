name: Daily Scam Entry

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-scam-entry
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Fail loudly if nothing has merged in too long
        # Real, load-bearing check, not signal-only like the one below.
        # Review-gating this pipeline (below) trades the old failure mode
        # (a bad entry publishes unreviewed) for a new one (PRs pile up
        # unreviewed and the database quietly goes stale) — this is what
        # catches the second one. api/reports.json's lastUpdated only
        # changes when a PR actually merges, since nothing pushes to main
        # directly anymore.
        run: node scripts/check-staleness.js
      - name: Course content health (signal only — never blocks this pipeline)
        # Scam-database entries are time-sensitive safety content; the
        # course is not. An overdue lesson must not stop a real scam
        # report from publishing. This logs the same warnings/failures
        # `npm run build` would enforce, but `|| true` means its exit
        # code can never fail this job or block the PR step below. The
        # real gate for course content is local: `npm run build` fails
        # for real before anyone archives/deploys it on purpose.
        run: npm run check-content || true
      - name: Generate daily scam entry
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-scam.js
      - name: Rebuild static scam pages
        if: steps.generate.outputs.result == 'written'
        run: npm run build:scams
      - name: Open a PR for review instead of publishing directly
        # Nothing goes live from this step — GitHub Pages here serves main
        # directly with no separate deploy Action, so an unmerged PR is
        # genuinely not live. A human has to read and merge it first.
        if: steps.generate.outputs.result == 'written'
        env:
          # Passed via env and always referenced quoted, not interpolated
          # directly into the script below — these strings come from model
          # output and could contain quotes or shell metacharacters, so
          # treat them as untrusted input.
          ENTRY_TITLE: ${{ steps.generate.outputs.title }}
          ENTRY_CITATION: ${{ steps.generate.outputs.citation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="scam-entry-$(date +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add api/reports.json scams/ sitemap.xml
          git commit -m "Add scam entry: $ENTRY_TITLE" -m "Source: $ENTRY_CITATION"
          git push origin "$BRANCH"
          printf '%s\n' \
            "**Title:** $ENTRY_TITLE" \
            "" \
            "**Source:** $ENTRY_CITATION" \
            "" \
            "Auto-generated by the daily scam-entry pipeline. This build passed the structural quality gate, a citation-URL resolution check (the link returns a real page), and a content-relevance check (the cited page's text actually mentions the title's key words). None of those confirm the claims themselves are accurate — read the entry before merging." \
            > pr-body.txt
          gh pr create \
            --title "Scam entry: $ENTRY_TITLE" \
            --base main \
            --head "$BRANCH" \
            --body-file pr-body.txt
