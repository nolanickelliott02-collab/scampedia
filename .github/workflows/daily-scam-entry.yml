name: Daily Scam Entry

on:
  schedule:
    # 17:00 UTC = noon Central (CDT). GitHub Actions cron doesn't shift for
    # DST, so this lands 11am Central during CST (Nov-Mar) instead — still
    # solidly midday, just not pinned to the exact minute across the year.
    - cron: '0 17 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-scam-entry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Course content health (signal only — never blocks this pipeline)
        # Scam-database entries are time-sensitive safety content; the
        # course is not. An overdue lesson must not stop a real scam
        # report from publishing. This logs the same warnings/failures
        # `npm run build` would enforce, but `|| true` means its exit
        # code can never fail this job or block the PR step below. The
        # real gate for course content is local: `npm run build` fails
        # for real before anyone archives/deploys it on purpose.
        run: npm run check-content || true
      - name: Generate daily scam entry
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-scam.js
      - name: Rebuild static scam pages
        if: steps.generate.outputs.result == 'written'
        run: npm run build:scams
      - name: Publish directly to main
        # Used to open a PR for a human to read before merging. Replaced by
        # an automated fact-check gate inside generate-daily-scam.js (a
        # second, independent Claude pass that checks the entry's specific
        # claims against the real fetched text of its own cited source) —
        # that gate is what now stands in for "a human reads this first."
        # Nothing upstream of this step is a stub: the structural, citation,
        # relevance, and fact-check gates all already ran for real, and a
        # rejection at any of them means this step never runs at all
        # (steps.generate.outputs.result would be gate-rejected, not
        # written). GitHub Pages serves main directly with no separate
        # deploy Action, so this push is what actually makes it live.
        if: steps.generate.outputs.result == 'written'
        run: |
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          git add api/reports.json scams/ sitemap.xml
          git commit -m "Add scam entry: ${{ steps.generate.outputs.title }}" -m "Source: ${{ steps.generate.outputs.citation }}"
          git push origin main
      - name: Notify devices of the new entry
        if: steps.generate.outputs.result == 'written'
        env:
          ENTRY_TITLE: ${{ steps.generate.outputs.title }}
          ENTRY_SUMMARY: ${{ steps.generate.outputs.summary }}
          ENTRY_SLUG: ${{ steps.generate.outputs.slug }}
          NOTIFY_SECRET: ${{ secrets.SCAMPEDIA_NOTIFY_SECRET }}
        # Best-effort: a failed push send must not fail this job or block
        # anything — the entry is already live on scampedia.net/reports.json
        # regardless of whether anyone gets pinged about it.
        run: |
          curl -sS -X POST "https://clever-bravery-production-2d5f.up.railway.app/api/notify-new-scam" \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: $NOTIFY_SECRET" \
            -d "$(node -e 'console.log(JSON.stringify({title: process.env.ENTRY_TITLE, summary: process.env.ENTRY_SUMMARY, slug: process.env.ENTRY_SLUG}))')" \
            || echo "Push notification failed, continuing anyway."
