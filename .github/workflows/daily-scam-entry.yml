name: Daily Scam Entry

on:
  schedule:
    # 17:00 UTC = noon Central (CDT). GitHub Actions cron doesn't shift for
    # DST, so this lands 11am Central during CST (Nov-Mar) instead — still
    # solidly midday, just not pinned to the exact minute across the year.
    - cron: '0 17 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-scam-entry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # No job here had an explicit timeout — GitHub's default is 360 minutes.
    # Worst case today (8 model turns, a couple of citation/relevance checks
    # each with up to 3 retry attempts at a 10s timeout) is a few minutes;
    # 10 gives real headroom without leaving a hung run tying up the
    # schedule for six hours before GitHub kills it itself.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Course content health (signal only — never blocks this pipeline)
        # Scam-database entries are time-sensitive safety content; the
        # course is not. An overdue lesson must not stop a real scam
        # report from publishing. This logs the same warnings/failures
        # `npm run build` would enforce, but `|| true` means its exit
        # code can never fail this job or block the PR step below. The
        # real gate for course content is local: `npm run build` fails
        # for real before anyone archives/deploys it on purpose.
        run: npm run check-content || true
      - name: Generate daily scam entry
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-scam.js
      - name: Email me if nothing published today
        # Found 2026-09-08: this pipeline had reported "success" every day
        # for 12 days straight while silently never writing an entry (the
        # generate step exits 0 on a skip/gate-rejection by design — see
        # runPipeline's comment on why that's correct — but that also meant
        # nobody found out same-day). The dedicated staleness watchdog only
        # fires after 5 full days of silence and never says why. This closes
        # that gap: whenever this run didn't actually publish, for any
        # reason, email the real reason today instead of waiting for a
        # generic "it's been stale" alert days later.
        if: always() && steps.generate.outputs.result != 'written' && steps.generate.outputs.result != 'already-ran'
        env:
          RESULT: ${{ steps.generate.outputs.result }}
          REASON: ${{ steps.generate.outputs.reason || steps.generate.outputs.error || 'no reason reported' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          curl -sS --max-time 15 -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              console.log(JSON.stringify({
                personalizations: [{ to: [{ email: "nolanickelliott02@gmail.com" }] }],
                from: { email: "alerts@officialverifyguard.com", name: "Scampedia Watchdog" },
                subject: "Daily Scam Entry did not publish today (" + process.env.RESULT + ")",
                content: [{ type: "text/plain", value:
                  "Today'"'"'s Daily Scam Entry run finished without publishing anything.\n\n" +
                  "Result: " + process.env.RESULT + "\n" +
                  "Reason: " + process.env.REASON + "\n\n" +
                  "This is not necessarily broken — a gate rejecting a bad candidate is it working as designed. " +
                  "But if this reason repeats every day, something structural (likely the citation/relevance " +
                  "network checks) is probably blocking every candidate. Run: github.com/nolanickelliott02-collab/scampedia/actions/workflows/daily-scam-entry.yml"
                }]
              }))
            ')" \
            || echo "Email alert failed, continuing anyway."
      - name: Save triage-rejected candidate to the review queue
        # Found 2026-09-13: writeToReviewQueue() (scripts/lib/scam-pipeline.js)
        # writes the rejected candidate to review/<date>-<slug>.json on this
        # runner's own disk, but nothing committed it back to the repo — the
        # file was silently discarded when the job ended, every single time
        # this branch fired. The email above is the only other notice, and
        # it goes through the same SendGrid pipeline already confirmed dead
        # (see project memory) — so a needs-review result had zero durable
        # record and zero real notification. This step is what actually
        # persists it so a human can find it in review/ later.
        if: steps.generate.outputs.result == 'needs-review'
        env:
          # Passed via env, not spliced into the script below, on purpose:
          # REASON is free text the model wrote based on real scraped web
          # content. Found 2026-09-18 — a real reason containing literal
          # `"QR Code Scam"` broke a prior version of this step that
          # interpolated ${{ }} directly into the shell command: the
          # embedded quotes closed the intended string early and the rest
          # got parsed as bare `git` arguments ("pathspec 'Code' did not
          # match any file(s)"). That's not just a formatting bug — it's the
          # shape of a real command-injection risk in a job with `contents:
          # write` and push access to main, since this text ultimately
          # traces back to whatever a scraped page said. env: + "$VAR" is
          # the safe pattern: bash treats it as one opaque string no matter
          # what characters it contains.
          REVIEW_PATH: ${{ steps.generate.outputs.reviewPath }}
          REASON: ${{ steps.generate.outputs.reason }}
        run: |
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          git add review/
          git commit -m "Queue for review: $REVIEW_PATH" -m "Reason: $REASON"
          git push origin main
      - name: Rebuild static scam pages
        # Also rebuilds /learn/ (build:learn), not just build:scams. Found
        # 2026-09-11: build:scams's own buildSitemap() fully overwrites
        # sitemap.xml with scam pages only — it has no idea /learn/ exists —
        # so every day only build:scams ran here, this step silently erased
        # any /learn/ sitemap entries a human had previously added by hand
        # via a full local `npm run build`. build:learn's updateSitemap()
        # is the half that actually knows how to add them back (it strips
        # then re-adds /learn/ URLs idempotently), so it has to run every
        # time this does. Deliberately NOT `npm run build` — that also runs
        # check-content with no `|| true`, which could hard-fail this step
        # on an overdue lesson and block a real scam entry from publishing,
        # the same class of self-inflicted deadlock as the old staleness
        # watchdog. check-content already ran, non-blocking, above.
        if: steps.generate.outputs.result == 'written'
        run: npm run build:scams && npm run build:learn
      - name: Publish directly to main
        # Used to open a PR for a human to read before merging. Replaced by
        # an automated fact-check gate inside generate-daily-scam.js (a
        # second, independent Claude pass that checks the entry's specific
        # claims against the real fetched text of its own cited source) —
        # that gate is what now stands in for "a human reads this first."
        # Nothing upstream of this step is a stub: the structural, citation,
        # relevance, and fact-check gates all already ran for real, and a
        # rejection at any of them means this step never runs at all
        # (steps.generate.outputs.result would be gate-rejected, not
        # written). GitHub Pages serves main directly with no separate
        # deploy Action, so this push is what actually makes it live.
        if: steps.generate.outputs.result == 'written'
        env:
          # env: + "$VAR" for the same reason as the review-queue step above
          # — title/citation/titles are free text traceable back to a
          # scraped page, never safe to splice directly into a shell script
          # via ${{ }}.
          COUNT: ${{ steps.generate.outputs.count }}
          TITLES: ${{ steps.generate.outputs.titles }}
          LAST_TITLE: ${{ steps.generate.outputs.title }}
          CITATION: ${{ steps.generate.outputs.citation }}
        run: |
          git config user.name "scampedia-bot"
          git config user.email "actions@github.com"
          git add api/reports.json scams/ learn/ sitemap.xml llms.txt
          PLURAL="ies"; [ "$COUNT" = "1" ] && PLURAL="y"
          git commit -m "Add $COUNT scam entr$PLURAL: $TITLES" -m "Last: $LAST_TITLE" -m "Source: $CITATION"
          git push origin main
      - name: Notify devices of the new entry
        if: steps.generate.outputs.result == 'written'
        env:
          ENTRY_TITLE: ${{ steps.generate.outputs.title }}
          ENTRY_SUMMARY: ${{ steps.generate.outputs.summary }}
          ENTRY_SLUG: ${{ steps.generate.outputs.slug }}
          NOTIFY_SECRET: ${{ secrets.SCAMPEDIA_NOTIFY_SECRET }}
        # Best-effort: a failed push send must not fail this job or block
        # anything — the entry is already live on scampedia.net/reports.json
        # regardless of whether anyone gets pinged about it.
        run: |
          curl -sS --max-time 15 -X POST "https://clever-bravery-production-2d5f.up.railway.app/api/notify-new-scam" \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: $NOTIFY_SECRET" \
            -d "$(node -e 'console.log(JSON.stringify({title: process.env.ENTRY_TITLE, summary: process.env.ENTRY_SUMMARY, slug: process.env.ENTRY_SLUG}))')" \
            || echo "Push notification failed, continuing anyway."
      - name: Alert on a real job failure (any step, not just "didn't publish")
        # Found 2026-09-18: a real bug (quoting — see the commit that added
        # env: to the two git-commit steps above) broke a step and lost a
        # real candidate, and nobody found out except by chance — the
        # "Email me if nothing published today" step only watches the
        # *generate* step's own outcome (skip/gate-rejected/needs-review),
        # not whether a LATER step in this same job actually failed. A red
        # X on a run nobody's watching is not a working alert. if: failure()
        # here means this step runs whenever ANY earlier step in this job
        # failed, regardless of which one — the one signal that should
        # never depend on someone coincidentally noticing.
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 15 -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              console.log(JSON.stringify({
                personalizations: [{ to: [{ email: "nolanickelliott02@gmail.com" }] }],
                from: { email: "alerts@officialverifyguard.com", name: "Scampedia Watchdog" },
                subject: "Daily Scam Entry job FAILED for real (not a gate rejection)",
                content: [{ type: "text/plain", value:
                  "A step in today'"'"'s Daily Scam Entry run actually failed — this is a real bug, not a gate " +
                  "working as designed (that path emails you separately, with a different subject line).\n\n" +
                  "Run: " + process.env.RUN_URL + "\n\n" +
                  "Open it and check which step failed and why before assuming this will fix itself tomorrow."
                }]
              }))
            ')" \
            || echo "Failure alert email failed too — nothing more this job can do."
